# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod properties
mod_version = 1.2.3
maven_group = com.shmove.cat_jam
archives_name = cat_jam
enabled_platforms = fabric,neoforge

# Minecraft properties
minecraft_version = 1.21
minecraft_version_range_fabric = ~1.21
minecraft_version_range_neoforge = [1.21,)
yarn_mappings = 1.21+build.2

# Dependencies
fabric_loader_version = 0.15.11
fabric_api_version = 0.100.1+1.21
neoforge_loader_version = [2,)
neoforge_version = 21.0.10-beta
yarn_mappings_patch_neoforge_version = 1.21+build.4

# Compatibility dependencies
voicechat_api_version = 2.3.3
